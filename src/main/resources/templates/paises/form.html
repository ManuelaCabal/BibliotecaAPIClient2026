<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('paises')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4 py-lg-5">
    <section class="form-shell mx-auto">
        <div class="form-shell-header mb-4">
            <span class="eyebrow">Gestión de países</span>
            <h1 class="display-6 fw-bold mb-2" th:text="${pageTitle}">Nuevo país</h1>
            <p class="text-secondary mb-0">Añade o modifica países vinculados a autores y premios.</p>
        </div>

        <form th:action="@{/paises/guardar}" th:object="${paisForm}" method="post" class="content-card p-4 p-lg-5">
            <input type="hidden" th:field="*{id}">

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Nombre del país</label>
                    <input type="text" class="form-control" th:field="*{nomPais}" placeholder="Colombia">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nomPais')}" th:errors="*{nomPais}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Bandera (URL o nombre)</label>
                    <input type="text" class="form-control" th:field="*{bandera}" placeholder="https://... o bandera.svg">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('bandera')}" th:errors="*{bandera}"></div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-3 mt-4">
                <button class="btn btn-primary px-4" type="submit" th:text="${submitLabel}">Guardar cambios</button>
                <a class="btn btn-outline-secondary" th:href="@{/paises}">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
