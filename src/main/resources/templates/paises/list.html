<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Países')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('paises')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4 py-lg-5">
    <section class="page-header mb-4">
        <div>
            <span class="eyebrow">Cobertura internacional</span>
            <h1 class="display-6 fw-bold mb-2">Países</h1>
            <p class="text-secondary mb-0">Controla el inventario geográfico de autores y premios.</p>
        </div>
        <div class="d-flex gap-3 align-items-center">
            <div class="metric-card compact">
                <span>Total</span>
                <strong th:text="${totalPaises}">0</strong>
            </div>
            <a class="btn btn-primary" th:href="@{/paises/nuevo}"><i class="bi bi-plus-circle me-2"></i>Nuevo país</a>
        </div>
    </section>

    <section class="content-card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-modern align-middle mb-0">
                <thead>
                <tr>
                    <th>País</th>
                    <th>Bandera</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(paises)}">
                    <td colspan="3" class="text-center py-5 text-secondary">No hay países para mostrar.</td>
                </tr>
                <tr th:each="pais : ${paises}">
                    <td class="fw-semibold" th:text="${pais.nomPais}">España</td>
                    <td>
                        <img class="thumb-img thumb-flag"
                             th:if="${pais.bandera != null and !#strings.isEmpty(pais.bandera)}"
                             th:src="${#strings.startsWith(pais.bandera, 'http') ? pais.bandera : '/images/paises/' + pais.bandera}"
                             th:alt="${'Bandera de ' + pais.nomPais}">
                        <span class="text-secondary small" th:if="${pais.bandera == null or #strings.isEmpty(pais.bandera)}">Sin bandera</span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/paises/{id}/editar(id=${pais.id})}"><i class="bi bi-pencil-square"></i></a>
                            <form th:action="@{/paises/{id}/eliminar(id=${pais.id})}" method="post" onsubmit="return confirm('¿Seguro que quieres eliminar este país?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash3"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
