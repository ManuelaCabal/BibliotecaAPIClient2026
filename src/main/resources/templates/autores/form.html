<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('autores')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4 py-lg-5">
    <section class="form-shell mx-auto">
        <div class="form-shell-header mb-4">
            <span class="eyebrow">Gestión de autores</span>
            <h1 class="display-6 fw-bold mb-2" th:text="${pageTitle}">Nuevo autor</h1>
            <p class="text-secondary mb-0">Completa la información principal y las relaciones del autor.</p>
        </div>

        <form th:action="@{/autores/guardar}" th:object="${autorForm}" method="post" class="content-card p-4 p-lg-5">
            <input type="hidden" th:field="*{id}">

            <div class="row g-4">
                <div class="col-md-4">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nomAutor}" placeholder="Gabriel">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nomAutor')}" th:errors="*{nomAutor}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Primer apellido</label>
                    <input type="text" class="form-control" th:field="*{apellido1}" placeholder="García">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('apellido1')}" th:errors="*{apellido1}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Segundo apellido</label>
                    <input type="text" class="form-control" th:field="*{apellido2}" placeholder="Márquez">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('apellido2')}" th:errors="*{apellido2}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fecha de defunción</label>
                    <input type="date" class="form-control" th:field="*{fechaDefuncion}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">País</label>
                    <select class="form-select" th:field="*{paisId}">
                        <option value="">Selecciona un país</option>
                        <option th:each="pais : ${paises}" th:value="${pais.id}" th:text="${pais.nomPais}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Localidad</label>
                    <input type="text" class="form-control" th:field="*{localidad}" placeholder="Aracataca">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('localidad')}" th:errors="*{localidad}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Foto (URL)</label>
                    <input type="text" class="form-control" th:field="*{foto}" placeholder="https://...">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('foto')}" th:errors="*{foto}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Premios</label>
                    <select class="form-select" th:field="*{premioIds}" multiple size="5">
                        <option th:each="premio : ${premiosDisponibles}" th:value="${premio.id}" th:text="${premio.nomPremio}"></option>
                    </select>
                    <div class="form-text">Mantén pulsada la tecla Ctrl o Cmd para elegir varios premios.</div>
                </div>

                <div class="col-12">
                    <label class="form-label">Biografía</label>
                    <textarea class="form-control" th:field="*{biografia}" rows="6" placeholder="Resumen biográfico del autor"></textarea>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('biografia')}" th:errors="*{biografia}"></div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-3 mt-4">
                <button class="btn btn-primary px-4" type="submit" th:text="${submitLabel}">Guardar cambios</button>
                <a class="btn btn-outline-secondary" th:href="@{/autores}">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
