<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | BibliotecaAPIClient26'">BibliotecaAPIClient26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top glass-nav" th:fragment="navbar(activeSection)">
    <div class="container py-2">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-journal-richtext"></i></span>
            <span>BibliotecaAPIClient26</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:classappend="${activeSection == 'inicio'} ? ' active'" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activeSection == 'autores'} ? ' active'" th:href="@{/autores}">Autores</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activeSection == 'libros'} ? ' active'" th:href="@{/libros}">Libros</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activeSection == 'paises'} ? ' active'" th:href="@{/paises}">Países</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activeSection == 'premios'} ? ' active'" th:href="@{/premios}">Premios</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container mt-4">
    <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert" th:if="${successMessage}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert" th:if="${errorMessage}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-warning shadow-sm" role="alert" th:if="${globalError}">
        <i class="bi bi-wifi-off me-2"></i><span th:text="${globalError}"></span>
    </div>
</div>

<footer class="site-footer mt-5" th:fragment="footer">
    <div class="container py-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div>
            <p class="mb-1 fw-semibold">Cliente MVC para BibliotecaAPI26</p>
            <small class="text-secondary">Panel de gestión profesional conectado a tu API REST local.</small>
        </div>
        <div class="d-flex align-items-center gap-2 text-secondary">
            <i class="bi bi-shield-check"></i>
            <small>Spring Boot · Thymeleaf · Bootstrap</small>
        </div>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
