<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('premios')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4 py-lg-5">
    <section class="form-shell mx-auto">
        <div class="form-shell-header mb-4">
            <span class="eyebrow">Gestión de premios</span>
            <h1 class="display-6 fw-bold mb-2" th:text="${pageTitle}">Nuevo premio</h1>
            <p class="text-secondary mb-0">Configura el reconocimiento, su alcance y su origen.</p>
        </div>

        <form th:action="@{/premios/guardar}" th:object="${premioForm}" method="post" class="content-card p-4 p-lg-5">
            <input type="hidden" th:field="*{id}">

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Nombre del premio</label>
                    <input type="text" class="form-control" th:field="*{nomPremio}" placeholder="Premio Nobel de Literatura">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nomPremio')}" th:errors="*{nomPremio}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tipo</label>
                    <input type="text" class="form-control" th:field="*{tipo}" placeholder="Internacional">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Año</label>
                    <input type="number" class="form-control" th:field="*{anyo}" placeholder="1901">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('anyo')}" th:errors="*{anyo}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">País</label>
                    <select class="form-select" th:field="*{paisId}">
                        <option value="">Selecciona un país</option>
                        <option th:each="pais : ${paises}" th:value="${pais.id}" th:text="${pais.nomPais}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Localidad</label>
                    <input type="text" class="form-control" th:field="*{localidad}" placeholder="Estocolmo">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('localidad')}" th:errors="*{localidad}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Logotipo (URL o recurso)</label>
                    <input type="text" class="form-control" th:field="*{logotipo}" placeholder="https://... o logo.svg">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('logotipo')}" th:errors="*{logotipo}"></div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-3 mt-4">
                <button class="btn btn-primary px-4" type="submit" th:text="${submitLabel}">Guardar cambios</button>
                <a class="btn btn-outline-secondary" th:href="@{/premios}">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
